services:
    database:
        image: postgis/postgis:16-3.4-alpine
        restart: unless-stopped
        command: ["postgres", "-c", "listen_addresses=*"]
        volumes:
            - ./database:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${DB_USER:-directus}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE:-directus}
        healthcheck:
            test: ["CMD", "pg_isready", "--username=${DB_USER:-directus}"]
            interval: 10s
            timeout: 5s
            retries: 5

    directus:
        image: directus/directus:12.0.2
        restart: unless-stopped
        ports:
            - "8055:8055"
        volumes:
            - ./uploads:/directus/uploads
            - ./extensions:/directus/extensions
        depends_on:
            database:
                condition: service_healthy
        environment:
            KEY: ${KEY}
            SECRET: ${SECRET}
            ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}
            DB_CLIENT: pg
            DB_HOST: database
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-directus}
            DB_USER: ${DB_USER:-directus}
            DB_PASSWORD: ${DB_PASSWORD}
            PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
            WEBSOCKETS_ENABLED: "true"
            CORS_ENABLED: "true"
            CORS_ORIGIN: "true"


